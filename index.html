<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendify - Student Attendance System</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-title">🎓 <span>Attendify</span></div>
      <div class="brand-subtitle">Student Attendance System</div>
    </div>
    <nav>
      <button class="nav-item active" data-page="dashboard">📊 <span>Dashboard</span></button>
      <button class="nav-item" data-page="students">👨‍🎓 <span>Students</span></button>
      <button class="nav-item" data-page="sections">🏫 <span>Sections</span></button>
      <button class="nav-item" data-page="attendance">📝 <span>Attendance</span></button>
      <button class="nav-item" data-page="history">🗓️ <span>History</span></button>
      <button class="nav-item" data-page="reports">📈 <span>Reports</span></button>
      <button class="nav-item" data-page="settings">⚙️ <span>Settings</span></button>
    </nav>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="pageTitle">Dashboard</h1>
        <p id="today"></p>
      </div>
      <div class="teacher">Teacher: <strong id="teacherName">Admin</strong></div>
    </header>
    <div id="content"></div>
  </main>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <button class="close" id="closeModal">×</button>
    <div id="modalContent"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
